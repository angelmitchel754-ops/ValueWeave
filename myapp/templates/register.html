{% extends 'base.html' %}
{% block content %}
<div class="form-box">
    <h2>Create Account</h2>
    <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn" style="width:100%">Register</button>
    </form>
    <p style="text-align:center; margin-top:15px;">Already have account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
