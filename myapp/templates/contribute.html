{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Contribute - ValueWeave</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; margin:0; background:#f7f7f7; }
        .header { background:white; padding:15px 20px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 5px #ddd; }
        .header img { height:40px; }
        .container { max-width:600px; margin:30px auto; background:white; padding:25px; border-radius:12px; }
        h1 { color:#1a7a4a; margin-top:0; }
        label { display:block; margin-top:15px; font-weight:bold; }
        input, select, textarea { width:100%; padding:12px; margin-top:5px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
        .types { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
        .types button { padding:15px; border:2px solid #ddd; background:white; border-radius:10px; cursor:pointer; font-size:16px; }
        .types button.active { border-color:#1a7a4a; background:#e8f5ee; }
        .submit { background:#1a7a4a; color:white; border:none; padding:15px; width:100%; margin-top:20px; border-radius:8px; font-size:18px; cursor:pointer; }
        .back { display:block; text-align:center; margin-top:15px; color:#555; }
    </style>
</head>
<body>
    <div class="header">
        <img src="{% static 'myapp/logo.webp' %}" alt="ValueWeave">
        <b>ValueWeave</b>
    </div>

    <div class="container">
        <h1>Contribute</h1>
        <p>Every contribution creates value. Choose how you'd like to help:</p>

        <form method="post">
            {% csrf_token %}
            <label>Your Name</label>
            <input type="text" name="name" placeholder="Angel Mitchel" required>

            <label>Phone / M-Pesa Number</label>
            <input type="tel" name="phone" placeholder="0712 345 678" required>

            <label>What do you want to contribute?</label>
            <div class="types">
                <button type="button" onclick="selectType(this, 'Money')">💰 Money</button>
                <button type="button" onclick="selectType(this, 'Clothes')">👕 Clothes</button>
                <button type="button" onclick="selectType(this, 'Food')">🍲 Food</button>
                <button type="button" onclick="selectType(this, 'Time')">⏰ Time / Volunteer</button>
            </div>
            <input type="hidden" name="type" id="typeInput" value="Money" required>

            <label id="amountLabel">Amount (KES)</label>
            <input type="number" name="amount" id="amountInput" placeholder="e.g. 500">

            <label>Details / Message</label>
            <textarea name="details" rows="3" placeholder="e.g. 2 bags of clothes, available on Saturday..."></textarea>

            <button class="submit" type="submit">Send Contribution →</button>
        </form>

        <a class="back" href="/">← Back to Home</a>
    </div>

    <script>
        function selectType(btn, type) {
            document.querySelectorAll('.types button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('typeInput').value = type;
            if (type === 'Money') {
                document.getElementById('amountLabel').innerText = 'Amount (KES)';
                document.getElementById('amountInput').placeholder = 'e.g. 500';
            } else {
                document.getElementById('amountLabel').innerText = 'Quantity / Details';
                document.getElementById('amountInput').placeholder = 'e.g. 2 bags, 5 hours';
            }
        }
    </script>
</body>
</html>
