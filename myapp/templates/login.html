{% extends 'base.html' %}
{% block content %}
<div class="form-box">
    <h2>Welcome Back</h2>
    <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn" style="width:100%">Login</button>
    </form>
    <p style="text-align:center; margin-top:15px;">No account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
