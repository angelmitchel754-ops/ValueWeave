services:
    - type: web
    name: valueweave
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn ValueWeave.wsgi:application"
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: valueweave-db
          property: connectionString
            - key: SECRET_KEY
        generateValue: true
databases:
    - name: valueweave-db
    databaseName: valueweave
    user: valueweave